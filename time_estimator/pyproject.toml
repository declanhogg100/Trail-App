[project]
name = "time-estimator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "gpxpy>=1.6.2",
    "jupyter>=1.1.1",
    "kaggle>=1.7.4.5",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "scikit-learn>=1.6.1",
    "torch>=2.8.0",
]

[project.scripts]
time-estimator = "time_estimator:main"

[tool.uv.sources]
# see the same marker in recommender/pyproject.toml -- the production server
# has no GPU, so this avoids pulling in several GB of unused CUDA packages
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
