[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "declanmzhogg@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pyjwt[crypto]>=2.15.0",
    "recommender",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.54",
    "time-estimator",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
time-estimator = { path = "../time_estimator", editable = true }
recommender = { path = "../recommender", editable = true }
