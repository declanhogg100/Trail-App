[project]
name = "recommender"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "declanmzhogg@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "osmnx>=2.1.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "rasterio>=1.5.1",
    "torch>=2.14.0",
]

[project.scripts]
recommender = "recommender:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
