[project]
name = "recommender"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "declanmzhogg@icloud.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "osmium>=4.3.1",
    "osmnx>=2.1.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "rasterio>=1.5.1",
    "torch>=2.14.0",
]

[project.scripts]
recommender = "recommender:main"

[tool.uv]
# darwin for local dev on macOS, linux for the production server (the API
# process imports this package directly, so its lockfile has to resolve on
# whatever platform actually runs api.main:app)
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[tool.uv.sources]
# the production server has no GPU -- without this, uv resolves torch's
# default Linux wheel, which drags in several GB of CUDA/NVIDIA packages
# that would never be used, for a model small enough that CPU inference is
# instant anyway
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
